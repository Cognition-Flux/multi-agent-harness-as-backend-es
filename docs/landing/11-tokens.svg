  <g transform="translate(0,80)"><rect x="0" y="6" width="52" height="28" rx="8" fill="#2a2623"/><text class="ink" x="66" y="25" font-size="13" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">--primary</text><text class="muted" x="250" y="25" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">#2a2623</text><text class="muted" x="350" y="25" font-size="13">botones — grafito, no naranja</text><line class="hair" x1="0" y1="39" x2="960" y2="39" stroke-width="1"/></g>
  <g transform="translate(0,120)"><rect x="0" y="6" width="52" height="28" rx="8" fill="#1c1917"/><text class="ink" x="66" y="25" font-size="13" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">--foreground</text><text class="muted" x="250" y="25" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">#1c1917</text><text class="muted" x="350" y="25" font-size="13">tinta</text><line class="hair" x1="0" y1="39" x2="960" y2="39" stroke-width="1"/></g>
