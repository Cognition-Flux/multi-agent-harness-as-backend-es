<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="La paleta de la plataforma: cada token con su muestra de color, su valor hexadecimal y su función">
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
    .ink { fill: #1c1917; } .muted { fill: #696059; }
    .card { fill: #ffffff; stroke: #e9e5e2; }
    .hair { stroke: #e9e5e2; }
    .brand { fill: #b04507; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="959" height="399" rx="12" fill="#fdfcfc" stroke="#e9e5e2" stroke-width="1"/>
