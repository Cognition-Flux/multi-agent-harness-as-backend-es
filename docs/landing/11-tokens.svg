  <g transform="translate(0,360)"><rect x="0" y="6" width="52" height="28" rx="8" fill="#096ca5"/><text class="ink" x="66" y="25" font-size="13" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">--info</text><text class="muted" x="250" y="25" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">#096ca5</text><text class="muted" x="350" y="25" font-size="13">aviso neutro</text><line class="hair" x1="0" y1="39" x2="960" y2="39" stroke-width="1"/></g>
