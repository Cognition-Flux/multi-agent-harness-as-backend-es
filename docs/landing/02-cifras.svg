    .r3 { transform: translateY(-434px); animation: reel3 7s steps(7, end) infinite; }
    @keyframes reel3 { 0%{transform:translateY(0)} 22%{transform:translateY(-434px)} 100%{transform:translateY(-434px)} }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
