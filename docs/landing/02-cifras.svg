<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Cuatro cifras que cuentan desde cero: 16 tipos de documento, 11 categorías de requisitos, 8 etapas de revisión en vivo y 7 estados de cumplimiento">
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
    .ink { fill: #1c1917; } .muted { fill: #696059; }
    .card { fill: #ffffff; stroke: #e9e5e2; }
    .hair { stroke: #e9e5e2; }
    .brand { fill: #b04507; }

    .r0 { transform: translateY(-992px); animation: reel0 7s steps(16, end) infinite; }
    @keyframes reel0 { 0%{transform:translateY(0)} 22%{transform:translateY(-992px)} 100%{transform:translateY(-992px)} }
    .r1 { transform: translateY(-682px); animation: reel1 7s steps(11, end) infinite; }
