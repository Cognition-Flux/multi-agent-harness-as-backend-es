# Vendra — the full stack, off the shelf (SPEC §0, §9.4):
#   cp .env.docker.example .env.docker   # then set the four remote keys
#   docker compose up
# Five services: postgres (the app's own DB), minio (S3-compatible storage),
# minio-init (one-shot bucket creation), migrate (one-shot Drizzle apply +
# demo seed — prints the login credentials), app (Next standalone server).
name: vendra
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vendra
      POSTGRES_USER: vendor
      POSTGRES_PASSWORD: vendor # local-only container creds, not secrets
    ports:
      - "5436:5432" # 5436 host-side — 5435 is a common local-postgres port
    volumes:
      - vendor_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendor -d vendra"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API — host-exposed: browsers PUT/GET presigned URLs
      - "9001:9001" # console
    volumes:
      - vendor_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init: # one-shot: bucket for the document store (§6.12)
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      (mc mb -p local/vendor-docs || true) &&
      (mc anonymous set none local/vendor-docs || true)"

  migrate: # one-shot: apply committed migrations + demo seed (§9.5)
    build:
      context: .
      dockerfile: apps/vendra/Dockerfile
      target: migrator
    env_file: [.env.docker]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: apps/vendra/Dockerfile
      target: runner
    env_file: [.env.docker] # the §9.1 matrix, incl. the 4 user-supplied keys
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: always
    healthcheck: # distroless has no shell/curl — probe with the node binary
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  vendor_db_data: {}
  vendor_minio_data: {}
